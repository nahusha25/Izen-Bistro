
[project]
name = "restaurant_management"
authors = [
    { name = "Nahusha", email = "nahusha07@gmail.com" }
]
description = "Restaurant Management System"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = []

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

# Developer dependencies
[tool.bench.dev-dependencies]
# package_name = "~=1.1.0"

# Frappe Framework compatibility
[tool.bench.frappe-dependencies]
frappe = ">=16.0.0,<17.0.0"

# Ubuntu packages for Frappe Cloud deployment
[deploy.dependencies.apt]
packages = []

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = [
    "F",
    "E",
    "W",
    "I",
    "UP",
    "B",
    "RUF",
]
ignore = [
    "B017",
    "B018",
    "B023",
    "B904",
    "E101",
    "E402",
    "E501",
    "E741",
    "F401",
    "F403",
    "F405",
    "F722",
    "W191",
    "UP030",
    "UP031",
    "UP032",
    "UP037",
    "UP040",
]
typing-modules = ["frappe.types.DF"]

[tool.ruff.format]
quote-style = "double"
indent-style = "tab"
docstring-code-format = true
